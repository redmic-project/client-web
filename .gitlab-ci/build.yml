.web-build:
  image: ${WEB_BUILD_IMAGE_NAME}:${WEB_BUILD_IMAGE_TAG}
  variables:
    WEB_BUILD_IMAGE_NAME: registry.gitlab.com/redmic-project/docker/web-build
    WEB_BUILD_IMAGE_TAG: latest

.rules-branches-only:
  rules:
    - if: $CI_MERGE_REQUEST_ID ||
          $CI_COMMIT_TAG ||
          $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

⚒️ prepare-dependencies:
  extends:
    - .web-build
    - .rules-branches-only
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - type npm
    - npm -v
    - type node
    - node -v
  script:
    - npm install
  cache:
    paths:
      - node_modules/
      - client-app/dep/templates/node_modules/
      - client-app/style/node_modules/
  artifacts:
    name: ${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}
    expire_in: 1 week
    paths:
      - node_modules/
      - package-lock.json
      - client-app/dep/templates/node_modules/
      - client-app/dep/templates/dist/
      - client-app/style/node_modules/
      - client-app/style/style.styl
      - client-app/style/src/
      - client-app/style/dep/

🔧 npm-pack:
  extends:
    - .web-build
  stage: build
  script:
    - npm pack
  needs:
    - job: ⚒️ prepare-dependencies
  artifacts:
    name: ${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}
    expire_in: 1 month
    paths:
      - package-lock.json
      - redmic-project-web-*.tgz
      - client-app/build-report.txt
  rules:
    - if: $CI_MERGE_REQUEST_ID ||
          $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG &&
          $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*/i

.docker-build:
  needs:
    - job: 🔧 npm-pack
