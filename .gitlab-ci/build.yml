.web-build:
  image: ${WEB_BUILD_IMAGE_NAME}:${WEB_BUILD_IMAGE_TAG}
  variables:
    WEB_BUILD_IMAGE_NAME: registry.gitlab.com/redmic-project/docker/web-build
    WEB_BUILD_IMAGE_TAG: latest
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - >
      type npm && npm -v &&
      type node && node -v
    - npm install
  cache:
    paths:
      - node_modules/
      - client-app/dep/templates/node_modules/
      - client-app/style/node_modules/

⚒️ npm-pack:
  extends:
    - .web-build
    - .rules-branches-or-semantic-tags-only
  stage: build
  script:
    - npm pack
  artifacts:
    name: ${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}
    expire_in: 1 month
    paths:
      - package-lock.json
      - redmic-project-web-*.tgz

.docker-build:
  needs:
    - job: ⚒️ npm-pack

.rules-branches-or-semantic-tags-only:
  rules:
    - if: $CI_MERGE_REQUEST_ID ||
          $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG &&
          $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*/i
